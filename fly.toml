# Private shop desk for dev.ritzyheirloom.com.
# The volume is created with flyctl, not by this file:
#   fly volumes create ritzy_data --region iad --size 15 -a ritzy-heirloom-dev
# Fly keeps daily volume snapshots for 5 days. scripts/backup.mjs is the extra copy.
app = "ritzy-heirloom-dev"
primary_region = "iad"

[build]

[env]
  RITZY_DATA_DIR = "/data"
  RITZY_DATABASE_DRIVER = "sqlite"
  RITZY_FILE_DRIVER = "local"
  RITZY_EMAIL_DRIVER = "off"
  AI_PROVIDER = "anthropic"
  AI_MODEL = "claude-sonnet-5-5"
  AI_LOOKUP_DAILY_LIMIT = "40"
  AI_MAX_SEARCHES = "5"
  AI_MAX_IMAGES = "4"
  AI_TIMEOUT_MS = "45000"
  NODE_ENV = "production"

[http_service]
  internal_port = 4765
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[[mounts]]
  source = "ritzy_data"
  destination = "/data"
